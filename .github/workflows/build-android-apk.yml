name: Build Android APK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'android_app/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platforms
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug + release APK
        run: |
          gradle -p android_app assembleDebug assembleRelease
          echo "== Debug APK files =="
          ls -lah android_app/app/build/outputs/apk/debug || true
          echo "== Release APK files =="
          ls -lah android_app/app/build/outputs/apk/release || true

      - name: Resolve release APK path
        id: release_apk
        run: |
          RELEASE_APK=$(find android_app/app/build/outputs/apk/release -type f -name "*.apk" ! -name "*unsigned*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "No installable release APK found."
            ls -lah android_app/app/build/outputs/apk/release || true
            exit 1
          fi
          echo "release_apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "Resolved release APK: $RELEASE_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yamibo-mobile-debug-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yamibo-mobile-release-apk
          path: ${{ steps.release_apk.outputs.release_apk }}
